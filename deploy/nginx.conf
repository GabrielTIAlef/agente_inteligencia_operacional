server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;

    if ($http_host !~ "^(localhost|127\.0\.0\.1)(:8080)?$") { return 403; }

    location ~ ^/(operations/dashboard|operations/monitor/runs|reports/operations|agent/chat)$ {
        proxy_set_header Host localhost;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
