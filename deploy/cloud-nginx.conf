limit_req_zone $binary_remote_addr zone=api_limit:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=chat_limit:1m rate=2r/m;
limit_conn_zone $server_name zone=chat_concurrency:1m;
server {
    listen 80 default_server;
    server_name 137.131.236.116 inteligencia-operacional.duckdns.org;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://inteligencia-operacional.duckdns.org$request_uri; }
}
server {
    listen 443 ssl;
    server_name 137.131.236.116;
    ssl_certificate /etc/letsencrypt/live/137.131.236.116/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/137.131.236.116/privkey.pem;
    location / { return 301 https://inteligencia-operacional.duckdns.org$request_uri; }
}
server {
    listen 443 ssl;
    server_name inteligencia-operacional.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/inteligencia-operacional.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inteligencia-operacional.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /var/www/aio;
    client_max_body_size 8k;
    client_body_timeout 10s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /agent/chat {
        limit_req zone=chat_limit;
        limit_req_status 429;
        limit_conn chat_concurrency 1;
        limit_conn_status 429;
        proxy_read_timeout 100s;
        include /etc/nginx/aio-proxy.conf;
    }
    location ~ ^/(health|operations/dashboard|operations/monitor/runs|reports/operations)$ {
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/aio-proxy.conf;
    }
    location ~ ^/(operations/monitor/run|docs|redoc|openapi.json|metrics|agent|reports|operations)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
